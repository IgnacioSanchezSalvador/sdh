[General]
network = p2pNetworkExtended
sim-time-limit = 1s

# Visualization and animation
*.visualizer.*.enabled = true
*.visualizer.*.animationSpeed = 20
*.visualizer.*.displayRoutes = false
*.visualizer.*.displayPacketDrops = true
*.visualizer.*.displayLabels = true

# Disable recording
**.scalar-recording = true
**.vector-recording = true

# Optional: tune fiber delay and STM level here
*.lteA.stmLevel = 1
*.lteB.stmLevel = 1
*.lteA.numTributaries = 1
*.lteB.numTributaries = 1
*.lteA1.stmLevel = 1
*.lteB1.stmLevel = 1
*.lteA1.numTributaries = 1
*.lteB1.numTributaries = 1

# Traffic generation
*.sourceA.packetInterval = 50us
*.sourceA.packetSize = 3000 # in bytes


[STM1A]
*.sourceA.packetInterval = 125us
*.sourceA.packetSize = 2340 # en bytes
*.sourceB.packetInterval = 125us
*.sourceB.packetSize = 2430 # en bytes
*.lteA.stmLevel = 1
*.lteB.stmLevel = 1
*.lteA.numTributaries = 1
*.lteB.numTributaries = 1

[STM4A]
*.sourceA.packetInterval = 125us
*.sourceA.packetSize = 9360 # en bytes
*.sourceB.packetInterval = 125us
*.sourceB.packetSize = 9360 # en bytes
*.lteA.stmLevel = 4
*.lteB.stmLevel = 4
*.lteA.numTributaries = 4
*.lteB.numTributaries = 4

[STM16A]
*.sourceA.packetInterval = 125us
*.sourceA.packetSize = 37440 # en bytes
*.sourceB.packetInterval = 125us
*.sourceB.packetSize = 37440 # en bytes

*.sourceA1.packetInterval = 125us
*.sourceA1.packetSize = 37440 # en bytes
*.sourceB1.packetInterval = 125us
*.sourceB1.packetSize = 37440 # en bytes

*.lteA.stmLevel = 16
*.lteB.stmLevel = 16
*.lteA.numTributaries = 16
*.lteB.numTributaries = 16


[Protection]
*.lteA.useProtection = true
*.lteB.useProtection = true
*.lteA.protectionSwitchTime = 0.5s
*.lteB.protectionSwitchTime = 0.5s

*.lteA1.useProtection = true
*.lteB1.useProtection = true
*.lteA1.protectionSwitchTime = 0.5s
*.lteB1.protectionSwitchTime = 0.5s
